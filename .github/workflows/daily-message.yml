name: Daily GroupMe Message

on:
  schedule:
    # 7:00 AM UTC. Make sure to adjust this to your local timezone!
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to trigger manually to test

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Post Request
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"bot_id": "${{ secrets.GROUPME_BOT_ID }}", "text": "Mucking Reminder:\nN/A\n\nFeeding:\nN/A"}' \
          https://api.groupme.com/v3/bots/post
